<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title> 🚌 Abribus connecté – Louhans</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root {
  --bg: #0f172a;
  --panel: #020617;
  --text: #e5e7eb;
  --accent: #22c55e;
}
body.night {
  --bg: #020617;
  --panel: #000;
  --text: #94a3b8;
  --accent: #38bdf8;
}
body {
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.5s;
}

header {
  background:var(--panel);
  padding:1rem;
  text-align:center;
  border-bottom:3px solid var(--accent);
}

header h1 {
  margin:0;
  font-size:1.8rem;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

#logo {
  height:42px;
  cursor:pointer;
}

/* --- ZONE ALERTE CHAUFFEUR --- */
#zoneAlerteChauffeur {
  display:none; 
  background:#ffeb3b; 
  color:#000; 
  padding:15px; 
  border-radius:12px; 
  margin:10px; 
  border-left:8px solid #f57f17; 
  font-weight:bold; 
  text-align: center;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.01); }
  100% { transform: scale(1); }
}

section {
  background:var(--panel);
  margin:1rem;
  padding:1rem;
  border-radius:14px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:1rem;
}

h2 {color:var(--accent); margin-top:0;}

input, button {
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  font-size:0.95rem;
  margin-bottom:0.5rem;
}

button {
  background:var(--accent);
  font-weight:bold;
  cursor:pointer;
}

iframe {
  width:100%;
  height:320px;
  border:none;
  border-radius:12px;
  background:#000;
}

.clock {
  font-size:2.5rem;
  text-align:center;
  font-weight:bold;
}

#actualites {
  background:var(--panel);
  padding:10px;
  border-radius:10px;
  color:#cbd5f5;
  height:180px;
  overflow-y:auto;
}

.actualiteItem {margin-bottom:18px; border-bottom: 1px solid #334155; padding-bottom: 5px;}

#accesPrive{
  position:fixed;
  top:15px;
  right:15px;
  background:#1e293b;
  color:white;
  border:none;
  width:42px;
  height:42px;
  border-radius:50%;
  cursor:pointer;
  z-index:1000;
}
</style>
</head>

<body>
<button id="accesPrive">🔒</button>

<header>
  <h1>🚌 Abribus connecté</h1>
  <p id="cityLabel">Chargement...</p>
</header>

<div id="zoneAlerteChauffeur">
    <span id="texteAlerte"></span>
</div>

<section>
  <div class="clock" id="clock">--:--</div>
</section>

<section class="grid">
  <div class="recherche-box">
    <h2>Recherche de ville</h2>
    <input id="adresse" value="Louhans 71500" onkeydown="if(event.key==='Enter'){rechercherVille();}">
    <button onclick="rechercherVille()">Mettre à jour</button>
  </div>
  <div>
    <h2>Carte & arrêts</h2>
    <iframe id="map"></iframe>
  </div>
</section>

<section class="grid">
  <div>
    <h2>🌦 Météo</h2>
    <iframe id="meteoFrame"></iframe>
  </div>
  <div>
    <h2>🚌 Horaires</h2>
    <div id="prochainBus" style="font-size:1.1rem;color:#38bdf8;font-weight:bold;background:rgba(56,189,248,0.1);padding:10px;border-radius:8px;">
      🕒 Prochain bus : calcul...
    </div>
  </div>
</section>

<section>
  <h2>📰 Actualités locales</h2>
  <div id="actualites"></div>
</section>

<script>
// --- HORLOGE ---
function updateClock(){
  const n=new Date();
  document.getElementById('clock').textContent= n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock,1000); updateClock();

// --- RECHERCHE VILLE ---
function rechercherVille(){
  const villeInput = document.getElementById('adresse').value;

  fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(villeInput)}`)
  .then(r => r.json())
  .then(d => {
    if(!d.length) return alert('Ville introuvable');

    const lat = d[0].lat;
    const lon = d[0].lon;
    const nom = d[0].display_name.split(',')[0];

    document.getElementById('cityLabel').textContent = nom;
    document.getElementById('map').src = `https://www.openstreetmap.org/export/embed.html?bbox=${parseFloat(lon)-0.01},${parseFloat(lat)-0.01},${parseFloat(lon)+0.01},${parseFloat(lat)+0.01}&layer=mapnik`;
    document.getElementById('meteoFrame').src = `https://www.meteoblue.com/fr/meteo/widget/three/${lat},${lon}`;

    localStorage.setItem("villeSauvegardee", nom); // On sauvegarde le nom propre
    verifierAlertesChauffeur();
    chargerActualites(nom);
  });
}

// --- LOGIQUE ALERTE CHAUFFEUR (CORRIGÉE) ---
function verifierAlertesChauffeur() {
    const zone = document.getElementById("zoneAlerteChauffeur");
    const texte = document.getElementById("texteAlerte");
    const villeAffichee = document.getElementById('cityLabel').textContent.toLowerCase().trim();
    
    const rawData = localStorage.getItem("alerteAbribus");
    
    if (rawData) {
        try {
            const alerte = JSON.parse(rawData);
            const villeCible = alerte.villeCible.toLowerCase().trim();

            // Vérification si la ville correspond
            if (villeAffichee.includes(villeCible) || villeCible.includes(villeAffichee)) {
                zone.style.display = "block";
                texte.innerHTML = `⚠️ MESSAGE CHAUFFEUR (${alerte.heure}) : ${alerte.texte}`;
            } else {
                zone.style.display = "none";
            }
        } catch (e) { zone.style.display = "none"; }
    } else {
        zone.style.display = "none";
    }
}

// Vérification automatique toutes les 5 secondes
setInterval(verifierAlertesChauffeur, 5000);

function chargerActualites(ville){
  const actusDiv = document.getElementById('actualites');
  actusDiv.innerHTML = '⏳ Chargement...';
  fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(`https://news.google.com/rss/search?q=${ville}&hl=fr`)}`)
  .then(res=>res.json())
  .then(data=>{
    actusDiv.innerHTML = '';
    data.items.slice(0,5).forEach(item=>{
      const div=document.createElement('div');
      div.className='actualiteItem';
      div.innerHTML=`<b>${item.title}</b>`;
      actusDiv.appendChild(div);
    });
  });
}

// --- INITIALISATION ---
window.onload = () => {
  const v = localStorage.getItem("villeSauvegardee") || "Louhans";
  document.getElementById("adresse").value = v;
  rechercherVille();
};

document.getElementById("accesPrive").addEventListener("click", () => {
  if(prompt("Code chauffeur :") === "jesuischauffeur") window.location.href = "chauffeur.html";
});
</script>
</body>
</html>
