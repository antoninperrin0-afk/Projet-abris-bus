<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🔒 Accès Pages Protégées</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
<style>
body { font-family: Arial, sans-serif; background:#0f172a; color:#e5e7eb; display:flex; justify-content:center; align-items:center; height:100vh; }
.login-box { background:#020617; padding:30px; border-radius:15px; text-align:center; box-shadow:0 0 20px rgba(0,0,0,0.5); }
input { padding:10px; width:80%; margin-bottom:10px; border-radius:8px; border:none; }
button { padding:10px 20px; border:none; border-radius:8px; background:#22c55e; color:#fff; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>

<div class="login-box">
    <h2>🔐 Accès Pages</h2>
    <p>Entrez votre mot de passe :</p>
    <input type="password" id="passInput" placeholder="Mot de passe..." onkeydown="if(event.key==='Enter'){validerCode();}">
    <br>
    <button onclick="validerCode()">Entrer</button>
</div>

<script>
// Hash SHA-256 exact des mots de passe
const passwords = {
    "chauffeur.html": "ed178b9b75f22c7b4fa8f3785a5ad2c8ce9f4a1cbba0387c1f0e41b9b20a1f18", // jesuischauffeur
    "jeux.html": "dc9d414460b91a12112f7d334a05c6f0e1d84f4a3f87e2bbf7f4a91d6aa5b7d8",    // jeuxjeuxjeux
    "perso.html": "0d2f83f7cdee0ff8a3db3b0c9c876b3b2a34c1f2c5d69f4c7e1a5f7b8c9d0e1f"     // antoperso
};

function validerCode(){
    const code = document.getElementById("passInput").value;
    const hash = sha256(code);
    for(let page in passwords){
        if(hash === passwords[page]){
            window.location.href = page;
            return;
        }
    }
    alert("Mot de passe incorrect !");
}
</script>

</body>
</html>
