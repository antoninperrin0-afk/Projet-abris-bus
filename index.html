<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title> 🚌 Abribus connecté – Louhans</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="style.css">
</head>

<body>
<button id="accesPrive">🔒</button>
<header>
  <h1>
    <img id="logo" src="logo.png" alt="Logo Abribus">
    🚌 Abribus connecté
  </h1>
  <p id="cityLabel">Louhans (71500)</p>
</header>

<section>
  <div class="clock" id="clock">--:--</div>
  
  <div class="sensor-box">
      <div class="sensor-item">
          <span class="sensor-label">TEMPÉRATURE</span>
          <span class="sensor-value" id="temp">-- °C</span>
      </div>
      <div class="sensor-item">
          <span class="sensor-label">HUMIDITÉ</span>
          <span class="sensor-value" id="hum">-- %</span>
      </div>
  </div>
</section>

<section class="grid">
  <div class="recherche-box">
    <h2>Recherche de ville</h2>
    <input id="adresse" value="Louhans 71500" onkeydown="if(event.key==='Enter'){rechercherVille();}">
    <button onclick="rechercherVille()">Mettre à jour</button>
    <button onclick="localiserAbribus()">📍 Abribus le plus proche</button>
    <p id="coords"></p>               
  </div>
  <div>
    <h2>Carte & arrêts de bus</h2>
    <iframe id="map"></iframe>
  </div>
</section>

<section class="grid">
  <div>
    <h2>🌦 Météo</h2>
    <iframe id="meteoFrame" src="https://www.meteoblue.com/fr/meteo/widget/three/48.8566,2.3522"></iframe>
  </div>
  <div>
    <h2>🚌 Horaires bus</h2>
    <iframe id="busFrame"></iframe>
    <div id="prochainBus" style="margin-top:10px;font-size:1.1rem;font-weight:bold;">
      🕒 Prochain bus : calcul en cours...
    </div>
  </div>
</section>

<section>
  <h2 style="display:flex;align-items:center;gap:10px;">
    📰 Actualités locales & trafic
    <button id="toggleScrollBtn">⏸ Pause</button>
  </h2>

  <div id="alertBanner"></div>
  <div id="iaResume"></div>

  <div id="loadingActus" style="display:none;opacity:0.7;">
    ⏳ Chargement des actualités…
  </div>

  <div id="actualites"></div>

  <button id="backToTopBtn" style="display:none;margin-top:8px;">
    ⬆ Revenir en haut
  </button>
</section>

<script src="script.js"></script>

<footer>
Abribus intelligent – STI2D / SIN<br>
<a href="infos.html" style="color:#38bdf8;">En savoir plus</a>
</footer>
</body>
</html>
