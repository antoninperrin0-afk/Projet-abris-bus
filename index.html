<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title> 🚌 Abribus connecté – Louhans</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
/* ... (Tes styles existants restent les mêmes) ... */
:root {
  --bg: #0f172a;
  --panel: #020617;
  --text: #e5e7eb;
  --accent: #22c55e;
  --modal-bg: #1e293b;
}
body.night {
  --bg: #020617;
  --panel: #000;
  --text: #94a3b8;
  --accent: #38bdf8;
}
body {
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.5s;
}

header {
  background:var(--panel);
  padding:1rem;
  text-align:center;
  border-bottom:3px solid var(--accent);
}

header h1 {
  margin:0;
  font-size:1.8rem;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

#logo {
  height:42px;
  cursor:pointer;
  transition:transform 0.2s;
}

/* STYLE AJOUTÉ POUR LES CAPTEURS */
.sensor-box {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 10px;
  font-weight: bold;
  font-size: 1.2rem;
}
.sensor-item {
  background: rgba(34, 197, 94, 0.1);
  padding: 10px 20px;
  border-radius: 10px;
  border: 1px solid var(--accent);
}

/* (Reste du CSS...) */
section { background:var(--panel); margin:1rem; padding:1rem; border-radius:14px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:1rem; }
.clock { font-size:2.5rem; text-align:center; font-weight:bold; }
/* ... */
</style>
</head>

<body>

<header>
    <h1><img id="logo" src="logo.png" alt="Logo Abribus"> 🚌 Abribus connecté</h1>
    <p id="cityLabel">Louhans (71500)</p>
</header>

<section>
  <div class="clock" id="clock">--:--</div>
  
  <div class="sensor-box">
      <div class="sensor-item">🌡 Temp : <span id="temp">-- °C</span></div>
      <div class="sensor-item">💧 Humidité : <span id="hum">-- %</span></div>
  </div>
</section>

<section class="grid">
  <div>
    <h2>🌦 Météo</h2>
    <iframe id="meteoFrame"></iframe>
  </div>
  </section>

<script>
// --- TON CODE FIREBASE ---
const urlFirebase = "https://abribus-32b7e-default-rtdb.europe-west1.firebasedatabase.app/airsmart.json";

function recupererDonnee() {
    fetch(urlFirebase)
        .then(response => response.json())
        .then(data => {
            if(data) {
                // On met à jour les éléments HTML créés plus haut
                document.getElementById('temp').innerText = data.temperature + " °C";
                document.getElementById('hum').innerText = data.humidite + " %";
                
                // Optionnel : Alerte visuelle si température > 30
                if(parseFloat(data.temperature) > 30) {
                    document.getElementById('temp').style.color = "#dc2626"; // Rouge
                } else {
                    document.getElementById('temp').style.color = "var(--accent)";
                }
            }
        })
        .catch(error => console.error("Erreur Firebase:", error));
}
// Lancement de la récupération toutes les 2 secondes
setInterval(recupererDonnee, 2000);
recupererDonnee(); // Appel immédiat au chargement

// --- TA LOGIQUE EXISTANTE (Horloge, Recherche, etc.) ---
function updateClock(){
  const n=new Date();
  document.getElementById('clock').textContent=
    n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock,1000); updateClock();

// ... (Garde tout le reste de ton code script ici : rechercherVille, chargerActualites, etc.)
</script>

</body>
</html>
