<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>🚌 Abribus connecté – Louhans</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root {
  --bg: #0f172a;
  --panel: #020617;
  --text: #e5e7eb;
  --accent: #22c55e;
}
body.night {
  --bg: #020617;
  --panel: #000;
  --text: #94a3b8;
  --accent: #38bdf8;
}
body {
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.5s;
}

/* HEADER AVEC LOGO */
header {
  background:var(--panel);
  padding:1rem;
  border-bottom:3px solid var(--accent);
}
.headerContent {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}
#logo {
  height:48px;
  width:auto;
}
header h1 {margin:0; font-size:1.8rem;}
header p {margin:0.2rem 0 0; color:#94a3b8; font-size:1rem; text-align:center;}

section {
  background:var(--panel);
  margin:1rem;
  padding:1rem;
  border-radius:14px;
}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:1rem;
}
h2 {color:var(--accent); margin-top:0;}

input, button {
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  font-size:0.95rem;
  margin-bottom:0.5rem;
}
button {
  background:var(--accent);
  font-weight:bold;
  cursor:pointer;
}

iframe {
  width:100%;
  height:320px;
  border:none;
  border-radius:12px;
  background:#000;
}

.clock {
  font-size:2.5rem;
  text-align:center;
  font-weight:bold;
}

.recherche-box {max-width:360px;}

#actualites {
  background:var(--panel);
  padding:10px;
  border-radius:10px;
  color:#cbd5f5;
  height:180px;
  overflow-y:auto;
}

.actualiteItem {margin-bottom:18px;}
.actualiteItem .title {font-size:1.1rem; font-weight:bold;}

#toggleScrollBtn {
  width:auto;
  padding:6px 12px;
  font-size:0.9rem;
}

#backToTopBtn {
  background:#334155;
  color:white;
}

footer {
  text-align:center;
  padding:1rem;
  font-size:0.85rem;
  color:#64748b;
}
</style>
</head>

<body>

<header>
  <div class="headerContent">
    <!-- ✅ TON LOGO ICI -->
    <img id="logo" src="logo.png" alt="Logo abribus">
    <h1>🚌 Abribus connecté</h1>
  </div>
  <p id="cityLabel">Louhans (71500)</p>
</header>

<section>
  <div class="clock" id="clock">--:--</div>
</section>

<section class="grid">
  <div class="recherche-box">
    <h2>Recherche de ville</h2>
    <input id="adresse" value="Louhans 71500" onkeydown="if(event.key==='Enter'){rechercherVille();}">
    <button onclick="rechercherVille()">Mettre à jour</button>
    <p id="coords"></p>
  </div>
  <div>
    <h2>Carte & arrêts de bus</h2>
    <iframe id="map"></iframe>
  </div>
</section>

<section>
  <h2 style="display:flex;align-items:center;gap:10px;">
    📰 Actualités locales & trafic
    <button id="toggleScrollBtn">⏸ Pause</button>
  </h2>

  <div id="actualites"></div>

  <button id="backToTopBtn" style="display:none;margin-top:8px;">
    ⬆ Revenir en haut
  </button>
</section>

<footer>
  Abribus intelligent – STI2D / SIN
</footer>

<script>
// Horloge
function updateClock(){
  const n=new Date();
  document.getElementById('clock').textContent=
    n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock,1000); updateClock();

let autoScroll = true;
let scrollInterval = null;

const actualitesDiv=document.getElementById('actualites');
const toggleScrollBtn=document.getElementById('toggleScrollBtn');
const backToTopBtn=document.getElementById('backToTopBtn');

toggleScrollBtn.addEventListener('click', () => {
  autoScroll = !autoScroll;
  toggleScrollBtn.textContent = autoScroll ? '⏸ Pause' : '▶ Auto';
});

actualitesDiv.addEventListener('scroll', () => {
  backToTopBtn.style.display = actualitesDiv.scrollTop > 50 ? 'block' : 'none';
});

backToTopBtn.addEventListener('click', () => {
  autoScroll = false;
  toggleScrollBtn.textContent = '▶ Auto';
  actualitesDiv.scrollTo({ top: 0, behavior: 'smooth' });
});

function startScrolling(){
  if(scrollInterval) clearInterval(scrollInterval);
  scrollInterval = setInterval(()=>{
    if(!autoScroll) return;
    actualitesDiv.scrollTop += 1;
    if(actualitesDiv.scrollTop >= actualitesDiv.scrollHeight - actualitesDiv.clientHeight){
      actualitesDiv.scrollTop = 0;
    }
  }, 20);
}

function rechercherVille(){
  const ville = document.getElementById('adresse').value;
  actualitesDiv.innerHTML = "Actualités pour " + ville;
  startScrolling();
}

window.onload=rechercherVille;
</script>

</body>
</html>
