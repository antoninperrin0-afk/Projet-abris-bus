<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>🚌 Abribus connecté – Louhans</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
/* ############################
   VARIABLES COULEURS
############################ */
:root {
  --bg: #0f172a;
  --panel: #020617;
  --text: #e5e7eb;
  --accent: #22c55e;
}
body.night {
  --bg: #020617;
  --panel: #000;
  --text: #94a3b8;
  --accent: #38bdf8;
}
body {
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ############################
   STRUCTURE
############################ */
header {
  background:var(--panel);
  padding:1rem;
  text-align:center;
  border-bottom:3px solid var(--accent);
}

section {
  background:var(--panel);
  margin:1rem;
  padding:1rem;
  border-radius:14px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:1rem;
}

h2 {color:var(--accent); margin-top:0;}

iframe {
  width:100%;
  height:320px;
  border:none;
  border-radius:12px;
}

/* ############################
   BOUTON ACCES PRIVE
############################ */
#accesPrive{
  position:fixed;
  top:15px;
  right:15px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#1e293b;
  color:white;
  border:none;
  opacity:0.6;
  cursor:pointer;
}

/* ############################
   INFOS TRANSPORT
############################ */
.infoBox{
  background:#111827;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  text-align:center;
  font-size:1.1rem;
}

/* ############################
   FOOTER PROJET
############################ */
footer{
  text-align:center;
  padding:1.5rem;
  font-size:0.9rem;
  color:#94a3b8;
}
footer a{
  color:#38bdf8;
  text-decoration:none;
}
</style>
</head>

<body>

<!-- ############################
     BOUTON ACCES CHAUFFEUR
############################ -->
<button id="accesPrive">🔒</button>

<header>
  <h1>🚌 Abribus connecté</h1>
  <p id="cityLabel">Louhans</p>
</header>

<section>
  <div id="clock" style="font-size:2.5rem;text-align:center;"></div>
</section>

<section class="grid">
  <div>
    <h2>Recherche de ville</h2>
    <input id="adresse" value="Louhans">
    <button onclick="rechercherVille()">Mettre à jour</button>
    <button onclick="geoLocaliser()">📍 Abribus le plus proche</button>
    <p id="coords"></p>
  </div>

  <div>
    <h2>Carte & arrêts</h2>
    <iframe id="map"></iframe>
  </div>
</section>

<section class="grid">
  <div>
    <h2>🌦 Météo</h2>
    <iframe id="meteoFrame"></iframe>
  </div>

  <div>
    <h2>🚌 Transport</h2>
    <iframe id="busFrame"></iframe>

    <!-- #### Heure prochain bus #### -->
    <div class="infoBox">
      Prochain bus : <span id="prochainBus">--:--</span>
    </div>

    <!-- #### Compteur personnes #### -->
    <div class="infoBox">
      Personnes dans l'abribus : <span id="nbPersonnes">0</span>
    </div>
  </div>
</section>

<footer>
  Projet Abribus Intelligent – STI2D SIN<br>
  Dernière mise à jour : <span id="maj"></span><br><br>
  <a href="infos.html">En savoir plus sur le projet</a>
</footer>

<script>
/* ############################
   HORLOGE
############################ */
function updateClock(){
  const n=new Date();
  document.getElementById('clock').textContent =
    n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock,1000); updateClock();

/* ############################
   DATE MAJ
############################ */
document.getElementById("maj").textContent =
  new Date().toLocaleDateString('fr-FR');

/* ############################
   SIMULATION PROCHAIN BUS
############################ */
function calculerProchainBus(){
  const n=new Date();
  n.setMinutes(n.getMinutes()+Math.floor(Math.random()*15)+5);
  document.getElementById("prochainBus").textContent =
    n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(calculerProchainBus,20000);
calculerProchainBus();

/* ############################
   SIMULATION CAPTEUR PERSONNES
############################ */
setInterval(()=>{
  document.getElementById("nbPersonnes").textContent =
    Math.floor(Math.random()*8);
},5000);

/* ############################
   RECHERCHE VILLE
############################ */
function rechercherVille(){
  const ville = document.getElementById('adresse').value;
  localStorage.setItem("ville", ville);  // ### sauvegarde ###

  document.getElementById('cityLabel').textContent = ville;

  map.src = `https://www.google.com/maps?q=${ville}&output=embed&layer=transit`;
  busFrame.src = `https://www.google.com/maps?q=bus+${ville}&output=embed`;
  meteoFrame.src = `https://www.meteoblue.com/fr/meteo/widget/three/${ville}`;
}

/* ############################
   GEOLOCALISATION
############################ */
function geoLocaliser(){
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;

    map.src = `https://www.google.com/maps?q=${lat},${lon}&output=embed&layer=transit`;
    busFrame.src = `https://www.google.com/maps?q=bus+${lat},${lon}&output=embed`;
    meteoFrame.src = `https://www.meteoblue.com/fr/meteo/widget/three/${lat},${lon}`;
  });
}

/* ############################
   RESTAURATION VILLE SAUVEGARDEE
############################ */
window.onload=()=>{
  const v = localStorage.getItem("ville");
  if(v){ document.getElementById('adresse').value=v; rechercherVille(); }
};

/* ############################
   ACCES PAGE CHAUFFEUR
############################ */
document.getElementById("accesPrive").addEventListener("click",()=>{
  const code = prompt("Code chauffeur :");
  if(code==="jesuischauffeur"){
    location.href="chauffeur.html";
  }else if(code!==null){
    alert("Code incorrect");
  }
});
</script>

</body>
</html>
