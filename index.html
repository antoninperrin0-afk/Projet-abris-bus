<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title> 🚌 Abribus connecté – Louhans</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="style.css">
<style>
/* --- MODALE MOT DE PASSE --- */
.modal-overlay {
    display: none; 
    position: fixed; 
    top:0; left:0; 
    width:100%; height:100%; 
    background: rgba(15,23,42,0.85); 
    backdrop-filter: blur(4px); 
    justify-content: center; 
    align-items: center; 
    z-index: 2000;
}
.modal-card {
    background: var(--panel); 
    padding: 30px; 
    border-radius: 20px; 
    width: 90%; max-width: 400px; 
    text-align: center; 
    box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
    border: 1px solid rgba(255,255,255,0.1);
}
.modal-card h3 { margin-top:0; color: var(--accent);}
.modal-card input { width:100%; padding:10px; border-radius:10px; border:none; margin:10px 0; font-size:1rem;}
.modal-card button { background: var(--accent); color:#000; font-weight:bold; padding:10px 15px; border:none; border-radius:10px; cursor:pointer; margin:5px;}
.modal-card .btn-cancel { background:#475569; color:white;}
</style>
</head>
<body>

<!-- Bouton Accès Privé -->
<button id="accesPrive" title="Accès Privé">🔒</button>

<header>
    <h1><img id="logo" src="logo.png" alt="Logo Abribus"> 🚌 Abribus connecté</h1>
    <p id="cityLabel">Louhans (71500)</p>
</header>

<!-- MODALE MOT DE PASSE -->
<div id="loginModal" class="modal-overlay">
    <div class="modal-card">
        <h3>🔐 Accès Privé</h3>
        <p>Entrez le mot de passe pour accéder à la page souhaitée :</p>
        <input type="password" id="passInput" placeholder="Mot de passe...">
        <div>
            <button id="btnEnter">Entrer</button>
            <button class="btn-cancel" id="btnCancel">Annuler</button>
        </div>
    </div>
</div>

<!-- SECTION PRINCIPALE (inchangée) -->
<section>
    <div class="clock" id="clock">--:--</div>
</section>

<section class="grid">
    <div class="recherche-box">
        <h2>Recherche de ville</h2>
        <input id="adresse" value="Louhans 71500" onkeydown="if(event.key==='Enter'){rechercherVille();}">
        <button onclick="rechercherVille()">Mettre à jour</button>
        <button onclick="localiserAbribus()">📍 Abribus le plus proche</button>
        <p id="coords"></p>
    </div>
    <div>
        <h2>Carte & arrêts de bus</h2>
        <iframe id="map"></iframe>
    </div>
</section>

<!-- FOOTER -->
<footer>
Abribus intelligent – STI2D / SIN<br>
<a href="infos.html" style="color:#38bdf8;">En savoir plus</a>
</footer>

<script>
// Ouvrir la modale
const loginModal = document.getElementById("loginModal");
const passInput = document.getElementById("passInput");

document.getElementById("accesPrive").addEventListener("click", () => {
    loginModal.style.display = "flex";
    passInput.value = "";
    passInput.focus();
});

// Fermer la modale
document.getElementById("btnCancel").addEventListener("click", () => {
    loginModal.style.display = "none";
});

// Vérifier mot de passe
function validerMotDePasse() {
    const code = passInput.value.trim();
    if(code === "jesuischauffeur") window.location.href = "chauffeur.html";
    else if(code === "jeuxjeuxjeux") window.location.href = "jeux.html";
    else if(code === "antoperso") window.location.href = "perso.html";
    else alert("Mot de passe incorrect !");
}

// Bouton Entrer
document.getElementById("btnEnter").addEventListener("click", validerMotDePasse);

// Touche Enter
passInput.addEventListener("keydown", e => {
    if(e.key === "Enter") validerMotDePasse();
});
</script>

</body>
</html>
