<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title> 🚌 Abribus connecté – Louhans</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root {
  --bg: #0f172a;
  --panel: #020617;
  --text: #e5e7eb;
  --accent: #22c55e;
}
body.night {
  --bg: #020617;
  --panel: #000;
  --text: #94a3b8;
  --accent: #38bdf8;
}
body {
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.5s;
}

header {
  background:var(--panel);
  padding:1rem;
  text-align:center;
  border-bottom:3px solid var(--accent);
}

header h1 {
  margin:0;
  font-size:1.8rem;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

#logo {
  height:42px;
  cursor:pointer;
  transition:transform 0.2s;
}

.logo-anim {
  animation: logoBounce 0.6s ease;
}

@keyframes logoBounce {
  0%   { transform:scale(1) rotate(0deg); }
  25%  { transform:scale(1.2) rotate(-10deg); }
  50%  { transform:scale(1.25) rotate(10deg); }
  75%  { transform:scale(1.15) rotate(-5deg); }
  100% { transform:scale(1) rotate(0deg); }
}

section {
  background:var(--panel);
  margin:1rem;
  padding:1rem;
  border-radius:14px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:1rem;
}

h2 {color:var(--accent); margin-top:0;}

input, button {
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  font-size:0.95rem;
  margin-bottom:0.5rem;
}

button {
  background:var(--accent);
  font-weight:bold;
  cursor:pointer;
}

iframe {
  width:100%;
  height:320px;
  border:none;
  border-radius:12px;
  background:#000;
}

.clock {
  font-size:2.5rem;
  text-align:center;
  font-weight:bold;
}

footer {
  text-align:center;
  padding:1rem;
  font-size:0.85rem;
  color:#64748b;
}
</style>
</head>

<body>

<header>
  <h1>
    <img id="logo" src="logo.png" alt="Logo Abribus">
    🚌 Abribus connecté
  </h1>
  <p id="cityLabel">Louhans (71500)</p>
</header>

<section>
  <div class="clock" id="clock">--:--</div>
</section>

<section class="grid">
  <div>
    <h2>Recherche de ville</h2>
    <input id="adresse" value="Louhans 71500" onkeydown="if(event.key==='Enter'){rechercherVille();}">
    <button onclick="rechercherVille()">Mettre à jour</button>
    <button onclick="localiserAbribus()">📍 Abribus le plus proche</button>
    <p id="coords"></p>
  </div>

  <div>
    <h2>Carte & arrêts de bus</h2>
    <iframe id="map"></iframe>
  </div>
</section>

<section class="grid">
  <div>
    <h2>🌦 Météo</h2>
    <iframe id="meteoFrame"></iframe>
  </div>
  <div>
    <h2>🚌 Horaires bus</h2>
    <iframe id="busFrame"></iframe>

    <!-- ######## PROCHAIN BUS ######## -->
    <div id="prochainBus" style="margin-top:10px;font-size:1.1rem;font-weight:bold;">
      🕒 Prochain bus : calcul en cours...
    </div>
  </div>
</section>

<script>

/* ######## HORLOGE ######## */
function updateClock(){
  const n=new Date();
  document.getElementById('clock').textContent=
    n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateClock,1000);
updateClock();

/* ######## VARIABLES PRINCIPALES ######## */
const mapFrame=document.getElementById('map');
const meteoFrame=document.getElementById('meteoFrame');
const busFrame=document.getElementById('busFrame');
const cityLabel=document.getElementById('cityLabel');
const coordsDiv=document.getElementById('coords');

/* ######## SAUVEGARDE AUTOMATIQUE ######## */
/* Cette fonction enregistre la ville dans le navigateur */
function sauvegarderVille(ville){
  localStorage.setItem("villeAbribus", ville);
}

/* Cette fonction récupère la ville sauvegardée */
function chargerVilleSauvegardee(){
  const ville = localStorage.getItem("villeAbribus");
  if(ville){
    document.getElementById("adresse").value = ville;
  }
}

/* ######## RECHERCHE DE VILLE ######## */
function rechercherVille(){

  const ville = document.getElementById('adresse').value;

  /* ### SAUVEGARDE AUTOMATIQUE ### */
  sauvegarderVille(ville);

  fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(ville)}`)
  .then(r => r.json())
  .then(d => {

    if(!d.length) return alert('Ville introuvable');

    const lat = d[0].lat;
    const lon = d[0].lon;
    const nom = d[0].display_name.split(',')[0];

    cityLabel.textContent = nom;
    coordsDiv.textContent = `📍 ${lat}, ${lon}`;

    mapFrame.src = `https://www.google.com/maps?q=${encodeURIComponent(nom)}&z=14&output=embed&layer=transit`;
    meteoFrame.src = `https://www.meteoblue.com/fr/meteo/widget/three/${lat},${lon}`;
    busFrame.src = `https://www.google.com/maps?q=bus+${encodeURIComponent(nom)}&output=embed&layer=transit`;

    /* ######## SIMULATION HEURE PROCHAIN BUS ######## */
    const maintenant = new Date();
    maintenant.setMinutes(maintenant.getMinutes()+Math.floor(Math.random()*15)+3);
    const heureBus = maintenant.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    document.getElementById("prochainBus").textContent =
      "🕒 Prochain bus vers le centre : " + heureBus;
  });
}

/* ######## LOCALISATION GPS ######## */
function localiserAbribus(){
  if(!navigator.geolocation){
    alert("Géolocalisation non supportée");
    return;
  }

  navigator.geolocation.getCurrentPosition(pos=>{
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    document.getElementById("adresse").value = lat + "," + lon;

    sauvegarderVille(lat + "," + lon);

    mapFrame.src = `https://www.google.com/maps?q=bus&near=${lat},${lon}&output=embed`;
    cityLabel.textContent = "Position actuelle";
    coordsDiv.textContent = `📍 ${lat}, ${lon}`;
  });
}

/* ######## INITIALISATION AU DEMARRAGE ######## */
window.onload = () => {
  chargerVilleSauvegardee();   // recharge la dernière ville
  rechercherVille();           // affiche les infos
};

</script>

<footer>
Abribus intelligent – STI2D / SIN<br>
<a href="infos.html" style="color:#38bdf8;">En savoir plus</a>
</footer>

</body>
</html>
