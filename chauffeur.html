<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>🔑 Page Chauffeur – Abribus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>🔑 Accès Chauffeur – Abribus Louhans</h1>
</header>

<section>
    <div id="zoneAlerteChauffeur" style="display:none;">
        <span id="texteAlerte"></span>
    </div>

    <div class="clock" id="clock">--:--</div>
    <div class="sensor-box">
        <div class="sensor-item">
            <span class="sensor-label">TEMPÉRATURE</span>
            <span class="sensor-value" id="temp">-- °C</span>
        </div>
        <div class="sensor-item">
            <span class="sensor-label">HUMIDITÉ</span>
            <span class="sensor-value" id="hum">-- %</span>
        </div>
    </div>
</section>

<section class="grid">
    <div>
        <h2>Carte & arrêts de bus</h2>
        <iframe id="map"></iframe>
    </div>
    <div>
        <h2>Horaires bus & Prochain bus</h2>
        <iframe id="busFrame"></iframe>
        <div id="prochainBus" class="bus-timer">🕒 Prochain bus : calcul en cours...</div>
    </div>
</section>

<footer>
Chauffeur – Abribus Louhans
</footer>

<script src="chauffeur.js"></script>
</body>
</html>
