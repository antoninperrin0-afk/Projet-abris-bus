<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎮 Mini-Jeu Snake</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { background:#0f172a; color:#e5e7eb; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:sans-serif;}
canvas { background:#020617; border:2px solid #22c55e; }
button { margin-top:15px; padding:10px 15px; border:none; border-radius:8px; background:#22c55e; color:#000; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>

<h1>🎮 Snake ridicule</h1>
<canvas id="snakeCanvas" width="300" height="300"></canvas>
<button onclick="window.location.href='index.html'">Retour au site</button>

<script>
const canvas=document.getElementById('snakeCanvas');
const ctx=canvas.getContext('2d');

let snake=[{x:10,y:10}];
let dir={x:1,y:0};
let fruit={x:Math.floor(Math.random()*15),y:Math.floor(Math.random()*15)};
let taille=20;

function draw(){
    ctx.fillStyle="#020617";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // fruit
    ctx.fillStyle="#22c55e";
    ctx.fillRect(fruit.x*taille,fruit.y*taille,taille,taille);

    // snake
    ctx.fillStyle="#38bdf8";
    snake.forEach(s=>ctx.fillRect(s.x*taille,s.y*taille,taille,taille));

    // mouvement
    let head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};

    // collision mur
    if(head.x<0||head.x>=15||head.y<0||head.y>=15){
        alert("Game Over!");
        snake=[{x:10,y:10}];
        dir={x:1,y:0};
        return;
    }

    // collision fruit
    if(head.x===fruit.x && head.y===fruit.y){
        snake.unshift(head);
        fruit={x:Math.floor(Math.random()*15),y:Math.floor(Math.random()*15)};
    } else {
        snake.pop();
        snake.unshift(head);
    }
}
document.addEventListener('keydown',e=>{
    if(e.key==="ArrowUp") dir={x:0,y:-1};
    if(e.key==="ArrowDown") dir={x:0,y:1};
    if(e.key==="ArrowLeft") dir={x:-1,y:0};
    if(e.key==="ArrowRight") dir={x:1,y:0};
});
setInterval(draw,200);
</script>
</body>
</html>
