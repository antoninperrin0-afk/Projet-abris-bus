<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎮 Mini Snake</title>
<style>
body { background:#020617; color:#e5e7eb; display:flex; justify-content:center; align-items:center; height:100vh; font-family:Arial,sans-serif; }
canvas { background:#0f172a; display:block; margin:auto; }
</style>
</head>
<body>
<canvas id="game" width="300" height="300"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const size = 15;
let snake = [{x:10, y:10}];
let food = {x:5, y:5};
let dx = 0, dy = 0;

function draw(){
    ctx.fillStyle="#0f172a";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#22c55e";
    snake.forEach(seg => ctx.fillRect(seg.x*size, seg.y*size, size, size));

    ctx.fillStyle="#38bdf8";
    ctx.fillRect(food.x*size, food.y*size, size, size);
}

function update(){
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};
    snake.unshift(head);

    if(head.x===food.x && head.y===food.y){
        food = {x: Math.floor(Math.random()*20), y:Math.floor(Math.random()*20)};
    } else { snake.pop(); }

    // collision mur
    if(head.x<0||head.x>19||head.y<0||head.y>19){
        snake=[{x:10,y:10}]; dx=0; dy=0;
    }
}

document.addEventListener('keydown', e=>{
    if(e.key==='ArrowUp'){dx=0; dy=-1;}
    if(e.key==='ArrowDown'){dx=0; dy=1;}
    if(e.key==='ArrowLeft'){dx=-1; dy=0;}
    if(e.key==='ArrowRight'){dx=1; dy=0;}
});

setInterval(()=>{update(); draw();}, 200);
</script>
</body>
</html>
